
<div id="u1" style="padding:1rem 0;overflow-x:auto"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad:false, theme:'base',
  fontFamily:'"Anthropic Sans", sans-serif',
  themeVariables:{
    darkMode:dark, fontSize:'13px',
    fontFamily:'"Anthropic Sans", sans-serif',
    lineColor: dark?'#9c9a92':'#73726c',
    textColor: dark?'#c2c0b6':'#3d3d3a',
    primaryColor: dark?'#3C3489':'#EEEDFE',
    primaryTextColor: dark?'#CECBF6':'#26215C',
    primaryBorderColor: dark?'#7F77DD':'#AFA9EC',
    secondaryColor: dark?'#085041':'#E1F5EE',
    secondaryTextColor: dark?'#9FE1CB':'#04342C',
    secondaryBorderColor: dark?'#1D9E75':'#5DCAA5',
    tertiaryColor: dark?'#633806':'#FAEEDA',
    tertiaryTextColor: dark?'#FAC775':'#412402',
    tertiaryBorderColor: dark?'#BA7517':'#EF9F27',
    classText: dark?'#c2c0b6':'#3d3d3a',
  }
});
const d = `classDiagram
  direction TB

  class Usuario {
    +int id
    +String nombre
    +String email
    +String passwordHash
    +boolean notifPushActiva
    +boolean notifEmailActiva
    +Date fechaRegistro
    +registrar(email String, password String) void
    +autenticar(email String, password String) boolean
    +cerrarSesion() void
    +actualizarPerfil(nombre String) void
    +configurarNotificaciones(push boolean, email boolean) void
  }

  class Polla {
    +int id
    +String nombre
    +String enlaceInvitacion
    +VisibilidadPolla visibilidad
    +EstadoPolla estado
    +Date fechaCreacion
    +boolean reglasBlockeadas
    +crear(nombre String, visibilidad VisibilidadPolla) Polla
    +generarEnlace() String
    +bloquearReglas() void
    +transferirPropiedad(usuario Usuario) void
    +eliminarParticipante(p ParticipacionPolla) void
    +cerrar() void
    +archivar() void
  }

  class ParticipacionPolla {
    +RolPolla rol
    +Date fechaUnion
    +int puntajeTotal
    +int posicionRanking
    +calcularPuntajeTotal() int
    +actualizarPosicion() void
    +cambiarRol(rol RolPolla) void
    +salir() void
  }

  class ReglaPuntuacion {
    +int puntosExacto
    +int puntosResultadoCorrecto
    +int puntosFallo
    +int bonusPrediccionGlobal
    +boolean bloqueada
    +configurar(exacto int, correcto int, fallo int, bonus int) void
    +bloquear() void
    +calcularPuntos(prediccion Prediccion, partido Partido) int
    +restaurarDefecto() void
  }

  Usuario "1" --> "0..*" ParticipacionPolla : participa en
  Polla "1" --> "0..*" ParticipacionPolla : agrupa
  Polla "1" *-- "1" ReglaPuntuacion : define
`;
const {svg} = await mermaid.render('u1-svg', d);
document.getElementById('u1').innerHTML = svg;
const el = document.querySelector('#u1 svg');
if(el){el.style.width='100%';el.style.maxWidth='100%';}
</script>
