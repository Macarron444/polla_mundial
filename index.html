<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polla Mundial 2026</title>

  <link rel="stylesheet" href="src/css/styles.css">

  <!-- React sin babel en el cliente (el servidor transpila JSX) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script src="src/js/config.js"></script>
  <script src="src/js/utils.js"></script>
  <script src="src/js/components/shared.js"></script>
  <script src="src/js/components/Header.js"></script>
  <script src="src/js/components/Login.js"></script>
  <script src="src/js/components/TabPartidos.js"></script>
  <script src="src/js/components/TabGestionarPartidos.js"></script>
  <script src="src/js/components/TabRanking.js"></script>
  <script src="src/js/components/TabPredicciones.js"></script>
  <script src="src/js/app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('✅ SW registrado:', reg.scope))
          .catch(err => console.error('❌ SW error:', err));
      });
    }
  </script>
</body>
</html>
