<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polla Mundial 2026 - Dashboard</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #060c18; 
      color: #e2e8f0;
      font-family: 'DM Mono', 'Fira Code', monospace;
    }
    input:focus { outline: none; }
    button:hover { opacity: 0.8; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ── DATA ──────────────────────────────────────────────────────────────────────

    const EQUIPOS = [
      { id: 1, nombre: "Argentina", grupo: "A", flag: "🇦🇷" },
      { id: 2, nombre: "Francia",   grupo: "A", flag: "🇫🇷" },
      { id: 3, nombre: "Brasil",    grupo: "B", flag: "🇧🇷" },
      { id: 4, nombre: "España",    grupo: "B", flag: "🇪🇸" },
      { id: 5, nombre: "Alemania",  grupo: "C", flag: "🇩🇪" },
      { id: 6, nombre: "Portugal",  grupo: "C", flag: "🇵🇹" },
      { id: 7, nombre: "Inglaterra",grupo: "D", flag: "🏴󠁧󠁢󠁥󠁮󠁧󠁿" },
      { id: 8, nombre: "México",    grupo: "D", flag: "🇲🇽" },
    ];

    const ESTADOS_COLOR = {
      PROGRAMADO: { bg: "#1a2744", border: "#3b5bdb", text: "#748ffc", label: "Programado" },
      EN_CURSO:   { bg: "#1a3320", border: "#2f9e44", text: "#69db7c", label: "En Curso"   },
      FINALIZADO: { bg: "#1a1a1a", border: "#555",    text: "#aaa",    label: "Finalizado" },
      SUSPENDIDO: { bg: "#2d1a00", border: "#e67700", text: "#ffa94d", label: "Suspendido" },
      POSPUESTO:  { bg: "#2a1a2a", border: "#9c36b5", text: "#da77f2", label: "Pospuesto"  },
    };

    const PRED_COLOR = {
      PENDIENTE: { bg:"#1a2744", text:"#748ffc", dot:"#3b5bdb" },
      EXACTA:    { bg:"#0d2b1a", text:"#69db7c", dot:"#2f9e44" },
      CORRECTA:  { bg:"#1a2744", text:"#a9e34b", dot:"#74b816" },
      FALLIDA:   { bg:"#2a0d0d", text:"#ff8787", dot:"#c92a2a" },
    };

    const initialPartidos = [
      { id:1, local:1, visitante:2, golesL:null, golesV:null, fecha:"11 Jun · 18:00", estado:"PROGRAMADO", fase:"GRUPOS" },
      { id:2, local:3, visitante:4, golesL:2,    golesV:1,    fecha:"11 Jun · 21:00", estado:"FINALIZADO", fase:"GRUPOS" },
      { id:3, local:5, visitante:6, golesL:null, golesV:null, fecha:"12 Jun · 18:00", estado:"EN_CURSO",   fase:"GRUPOS" },
      { id:4, local:7, visitante:8, golesL:null, golesV:null, fecha:"12 Jun · 21:00", estado:"PROGRAMADO", fase:"OCTAVOS" },
    ];

    const initialParticipantes = [
      { id:1, nombre:"Sebastián M.", pts:21, exactas:3, correctas:4, fallidas:1, rol:"CREADOR" },
      { id:2, nombre:"Valentina R.", pts:18, exactas:2, correctas:5, fallidas:2, rol:"ADMINISTRADOR" },
      { id:3, nombre:"Camilo T.",    pts:18, exactas:2, correctas:4, fallidas:3, rol:"PARTICIPANTE" },
      { id:4, nombre:"Lucía P.",     pts:15, exactas:1, correctas:6, fallidas:2, rol:"PARTICIPANTE" },
      { id:5, nombre:"Andrés B.",    pts:12, exactas:1, correctas:4, fallidas:4, rol:"PARTICIPANTE" },
    ];

    const prediccionesUsuario = [
      { partidoId:2, golesL:2, golesV:0, estado:"CORRECTA",  pts:1 },
      { partidoId:3, golesL:1, golesV:2, estado:"PENDIENTE", pts:0 },
      { partidoId:1, golesL:1, golesV:1, estado:"PENDIENTE", pts:0 },
    ];

    const UML_CLASES = [
      {
        name:"Usuario", group:"gestion", color:"#3b5bdb",
        attrs:["+int id","+String nombre","+String email","+String passwordHash","+boolean notifPushActiva","+boolean notifEmailActiva"],
        methods:["+registrar()","+ autenticar()","+ cerrarSesion()","+ actualizarPerfil()","+ configurarNotificaciones()"],
      },
      {
        name:"Polla", group:"gestion", color:"#3b5bdb",
        attrs:["+int id","+String nombre","+String enlaceInvitacion","+VisibilidadPolla visibilidad","+EstadoPolla estado"],
        methods:["+crear()","+generarEnlace()","+bloquearReglas()","+transferirPropiedad()","+cerrar()","+archivar()"],
      },
      {
        name:"ParticipacionPolla", group:"gestion", color:"#3b5bdb",
        attrs:["+RolPolla rol","+Date fechaUnion","+int puntajeTotal","+int posicionRanking"],
        methods:["+calcularPuntajeTotal()","+actualizarPosicion()","+cambiarRol()","+salir()"],
      },
      {
        name:"ReglaPuntuacion", group:"gestion", color:"#3b5bdb",
        attrs:["+int puntosExacto","+int puntosResultadoCorrecto","+int puntosFallo","+int bonusPrediccionGlobal","+boolean bloqueada"],
        methods:["+configurar()","+bloquear()","+calcularPuntos()","+restaurarDefecto()"],
      },
      {
        name:"Partido", group:"prediccion", color:"#0f6e56",
        attrs:["+int id","+int golesLocal","+int golesVisitante","+Date fechaHora","+EstadoPartido estado","+FasePartido fase"],
        methods:["+actualizarEstado()","+registrarResultado()","+estaAbierto()","+esFaseEliminatoria()","+requiereClasificado()"],
      },
      {
        name:"Equipo", group:"prediccion", color:"#0f6e56",
        attrs:["+int id","+String nombre","+String grupo","+String codigoPais"],
        methods:["+obtenerNombreCompleto()","+esMismoEquipo()"],
      },
      {
        name:"Prediccion", group:"prediccion", color:"#0f6e56",
        attrs:["+int id","+int golesLocalPredicho","+int golesVisitantePredicho","+EstadoPrediccion estado","+int puntosObtenidos"],
        methods:["+registrar()","+editarMarcador()","+seleccionarClasificado()","+evaluar()","+calcularPuntos()"],
      },
      {
        name:"PrediccionGlobal", group:"prediccion", color:"#0f6e56",
        attrs:["+int id","+String maxGoleador","+boolean bloqueada","+int puntosObtenidos"],
        methods:["+registrar()","+editar()","+bloquear()","+evaluar()","+estaBloqueada()"],
      },
      {
        name:"Notificacion", group:"soporte", color:"#854f0b",
        attrs:["+int id","+String mensaje","+TipoNotificacion tipo","+boolean leida","+Date fechaEnvio"],
        methods:["+enviar()","+marcarLeida()","+crear()","+esPendiente()"],
      },
      {
        name:"ResultadoAPI", group:"soporte", color:"#854f0b",
        attrs:["+String fuente","+boolean exitoso","+Date fechaConsulta","+String rawData"],
        methods:["+consultar()","+parsear()","+registrarFallo()","+estaDisponible()","+notificarAdministrador()"],
      },
      {
        name:"CriterioDesempate", group:"soporte", color:"#854f0b",
        attrs:["+int prediccionesExactas","+int resultadosCorrectos","+int prediccionesFallidas","+int posicionFinal"],
        methods:["+calcular()","+compararCon()","+resolverEmpate()"],
      },
    ];

    const ENUMS = [
      { name:"EstadoPartido",    values:["PROGRAMADO","EN_CURSO","FINALIZADO","SUSPENDIDO","POSPUESTO"] },
      { name:"FasePartido",      values:["GRUPOS","DIECISEISAVOS","OCTAVOS","CUARTOS","SEMIFINAL","FINAL"] },
      { name:"EstadoPrediccion", values:["PENDIENTE","EXACTA","CORRECTA","FALLIDA"] },
      { name:"RolPolla",         values:["CREADOR","ADMINISTRADOR","PARTICIPANTE"] },
      { name:"TipoNotificacion", values:["PUSH","IN_APP","EMAIL"] },
      { name:"VisibilidadPolla", values:["PUBLICA","PRIVADA"] },
      { name:"EstadoPolla",      values:["ACTIVA","CERRADA","ARCHIVADA"] },
    ];

    // ── HELPERS ───────────────────────────────────────────────────────────────────

    const getEquipo = (id) => EQUIPOS.find(e => e.id === id) || { nombre:"?", flag:"" };

    const Dot = ({ color }) => (
      <span style={{
        display:"inline-block", width:7, height:7, borderRadius:"50%",
        background:color, marginRight:5, flexShrink:0,
      }}/>
    );

    function BadgeEstado({ estado }) {
      const c = ESTADOS_COLOR[estado] || ESTADOS_COLOR.PROGRAMADO;
      return (
        <span style={{
          background:c.bg, border:`1px solid ${c.border}`, color:c.text,
          fontSize:10, fontWeight:600, padding:"2px 8px", borderRadius:20,
          letterSpacing:"0.06em", display:"inline-flex", alignItems:"center", gap:4,
        }}>
          <Dot color={c.border}/>{c.label}
        </span>
      );
    }

    function BadgeRol({ rol }) {
      const map = {
        CREADOR:       { bg:"#1a1260", color:"#a5b4fc" },
        ADMINISTRADOR: { bg:"#12261a", color:"#6ee7b7" },
        PARTICIPANTE:  { bg:"#1a1a1a", color:"#9ca3af" },
      };
      const s = map[rol] || map.PARTICIPANTE;
      return (
        <span style={{
          background:s.bg, color:s.color, fontSize:9, fontWeight:700,
          padding:"2px 7px", borderRadius:10, letterSpacing:"0.07em",
        }}>{rol}</span>
      );
    }

    function btnStyle(color) {
      return {
        background: `${color}22`, border:`1px solid ${color}66`, color,
        fontSize:10, fontWeight:700, padding:"4px 10px", borderRadius:6,
        cursor:"pointer", letterSpacing:"0.05em",
      };
    }

    // ── SECTIONS ─────────────────────────────────────────────────────────────────

    function Header({ tab, setTab }) {
      const tabs = ["Partidos", "Ranking", "Mis Predicciones", "Clases UML"];
      return (
        <header style={{
          background:"#0a0f1e", borderBottom:"1px solid #1e2a45",
          padding:"0 24px", position:"sticky", top:0, zIndex:10,
        }}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", height:56 }}>
            <div style={{ display:"flex", alignItems:"center", gap:10 }}>
              <span style={{ fontSize:22 }}>⚽</span>
              <div>
                <div style={{ fontSize:13, fontWeight:700, color:"#e2e8f0", letterSpacing:"0.04em" }}>
                  Polla Mundial 2026
                </div>
                <div style={{ fontSize:10, color:"#4a6fa5", letterSpacing:"0.05em" }}>FIFA WORLD CUP · PWA</div>
              </div>
            </div>
            <div style={{ display:"flex", gap:4 }}>
              {tabs.map(t => (
                <button key={t} onClick={() => setTab(t)} style={{
                  background: tab===t ? "#1e3a6e" : "transparent",
                  border: tab===t ? "1px solid #3b5bdb" : "1px solid transparent",
                  color: tab===t ? "#748ffc" : "#6b7280",
                  fontSize:11, fontWeight:600, padding:"5px 12px", borderRadius:6,
                  cursor:"pointer", letterSpacing:"0.04em", transition:"all 0.15s",
                }}>{t}</button>
              ))}
            </div>
          </div>
        </header>
      );
    }

    function StatCard({ label, value, sub, accent }) {
      return (
        <div style={{
          background:"#0d1628", border:`1px solid ${accent}33`,
          borderRadius:12, padding:"16px 20px", flex:1, minWidth:110,
        }}>
          <div style={{ fontSize:11, color:"#6b7280", fontWeight:600, letterSpacing:"0.06em", marginBottom:6 }}>{label}</div>
          <div style={{ fontSize:28, fontWeight:800, color:accent, lineHeight:1 }}>{value}</div>
          {sub && <div style={{ fontSize:11, color:"#4a6fa5", marginTop:4 }}>{sub}</div>}
        </div>
      );
    }

    // ── TAB: PARTIDOS ─────────────────────────────────────────────────────────────

    function TabPartidos() {
      const [partidos, setPartidos] = useState(initialPartidos);
      const [editId, setEditId] = useState(null);
      const [gl, setGl] = useState(""); const [gv, setGv] = useState("");

      const faseLabel = { GRUPOS:"Fase de Grupos", OCTAVOS:"Octavos de Final", CUARTOS:"Cuartos", SEMIFINAL:"Semifinal", FINAL:"Final" };

      const avanzarEstado = (p) => {
        const ciclo = ["PROGRAMADO","EN_CURSO","FINALIZADO"];
        const idx = ciclo.indexOf(p.estado);
        if (idx < 0) return;
        const next = ciclo[Math.min(idx+1, ciclo.length-1)];
        setPartidos(prev => prev.map(x => x.id===p.id
          ? { ...x, estado:next, golesL: next==="FINALIZADO"? (x.golesL??1) : x.golesL, golesV: next==="FINALIZADO"? (x.golesV??0) : x.golesV }
          : x
        ));
      };

      const saveResult = (p) => {
        setPartidos(prev => prev.map(x => x.id===p.id
          ? { ...x, golesL:parseInt(gl)||0, golesV:parseInt(gv)||0, estado:"FINALIZADO" }
          : x
        ));
        setEditId(null); setGl(""); setGv("");
      };

      return (
        <div style={{ padding:"24px 0" }}>
          <div style={{ display:"flex", gap:12, marginBottom:20, flexWrap:"wrap" }}>
            <StatCard label="PARTIDOS" value={partidos.length} sub="Total registrados" accent="#748ffc"/>
            <StatCard label="EN CURSO" value={partidos.filter(p=>p.estado==="EN_CURSO").length} accent="#69db7c"/>
            <StatCard label="FINALIZADOS" value={partidos.filter(p=>p.estado==="FINALIZADO").length} accent="#aaa"/>
            <StatCard label="PENDIENTES" value={partidos.filter(p=>p.estado==="PROGRAMADO").length} accent="#4dabf7"/>
          </div>

          <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
            {partidos.map(p => {
              const loc = getEquipo(p.local);
              const vis = getEquipo(p.visitante);
              const isEdit = editId === p.id;
              const c = ESTADOS_COLOR[p.estado];
              return (
                <div key={p.id} style={{
                  background:"#0d1628", border:`1px solid ${c.border}44`,
                  borderRadius:12, padding:"14px 18px",
                  transition:"border-color 0.2s",
                }}>
                  <div style={{ display:"flex", alignItems:"center", gap:12, flexWrap:"wrap" }}>
                    <span style={{ fontSize:10, color:"#4a6fa5", fontWeight:600, width:90, flexShrink:0 }}>
                      {faseLabel[p.fase] || p.fase}
                    </span>
                    <div style={{ display:"flex", alignItems:"center", gap:6, flex:1, minWidth:100 }}>
                      <span style={{ fontSize:20 }}>{loc.flag}</span>
                      <span style={{ fontSize:13, fontWeight:600, color:"#e2e8f0" }}>{loc.nombre}</span>
                    </div>
                    <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                      {isEdit ? (
                        <>
                          <input value={gl} onChange={e=>setGl(e.target.value)} type="number" min="0" max="20" style={{
                            width:36, textAlign:"center", background:"#1e2a45", border:"1px solid #3b5bdb",
                            color:"#e2e8f0", borderRadius:6, padding:"4px", fontSize:16, fontWeight:700,
                          }}/>
                          <span style={{ color:"#4a6fa5", fontWeight:700 }}>–</span>
                          <input value={gv} onChange={e=>setGv(e.target.value)} type="number" min="0" max="20" style={{
                            width:36, textAlign:"center", background:"#1e2a45", border:"1px solid #3b5bdb",
                            color:"#e2e8f0", borderRadius:6, padding:"4px", fontSize:16, fontWeight:700,
                          }}/>
                        </>
                      ) : (
                        <span style={{
                          fontSize:20, fontWeight:800,
                          color: p.estado==="FINALIZADO" ? "#e2e8f0" : "#4a6fa5",
                          letterSpacing:4, minWidth:60, textAlign:"center",
                        }}>
                          {p.golesL !== null ? `${p.golesL} – ${p.golesV}` : "· – ·"}
                        </span>
                      )}
                    </div>
                    <div style={{ display:"flex", alignItems:"center", gap:6, flex:1, minWidth:100, justifyContent:"flex-end" }}>
                      <span style={{ fontSize:13, fontWeight:600, color:"#e2e8f0" }}>{vis.nombre}</span>
                      <span style={{ fontSize:20 }}>{vis.flag}</span>
                    </div>
                    <div style={{ display:"flex", alignItems:"center", gap:8, flexShrink:0 }}>
                      <BadgeEstado estado={p.estado}/>
                      {isEdit ? (
                        <>
                          <button onClick={()=>saveResult(p)} style={btnStyle("#2f9e44")}>✓ Guardar</button>
                          <button onClick={()=>setEditId(null)} style={btnStyle("#555")}>✕</button>
                        </>
                      ) : (
                        <>
                          {p.estado !== "FINALIZADO" && (
                            <button onClick={()=>avanzarEstado(p)} style={btnStyle("#3b5bdb")}>
                              {p.estado==="PROGRAMADO" ? "▶ Iniciar" : "✓ Finalizar"}
                            </button>
                          )}
                          {p.estado === "EN_CURSO" || p.estado==="FINALIZADO" ? (
                            <button onClick={()=>{ setEditId(p.id); setGl(p.golesL??""); setGv(p.golesV??""); }} style={btnStyle("#666")}>
                              ✎ Editar
                            </button>
                          ) : null}
                        </>
                      )}
                    </div>
                  </div>
                  <div style={{ fontSize:10, color:"#4a6fa5", marginTop:8, paddingLeft:2 }}>
                    {p.fecha} · RF-05 / RF-15
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ── TAB: RANKING ──────────────────────────────────────────────────────────────

    function TabRanking() {
      const sorted = [...initialParticipantes].sort((a,b) => {
        if (b.pts !== a.pts) return b.pts - a.pts;
        if (b.exactas !== a.exactas) return b.exactas - a.exactas;
        if (b.correctas !== a.correctas) return b.correctas - a.correctas;
        return a.fallidas - b.fallidas;
      });

      const maxPts = sorted[0].pts;

      return (
        <div style={{ padding:"24px 0" }}>
          <div style={{ display:"flex", gap:12, marginBottom:20, flexWrap:"wrap" }}>
            <StatCard label="PARTICIPANTES" value={sorted.length} accent="#748ffc"/>
            <StatCard label="PUNTAJE MÁXIMO" value={maxPts} sub="pts" accent="#ffd43b"/>
            <StatCard label="PROMEDIO" value={Math.round(sorted.reduce((a,p)=>a+p.pts,0)/sorted.length)} sub="pts" accent="#69db7c"/>
          </div>

          <div style={{ background:"#0d1628", border:"1px solid #1e2a45", borderRadius:12, overflow:"hidden" }}>
            <div style={{
              display:"grid", gridTemplateColumns:"40px 1fr 80px 80px 80px 70px 100px",
              gap:8, padding:"10px 18px", borderBottom:"1px solid #1e2a45",
              fontSize:9, fontWeight:700, color:"#4a6fa5", letterSpacing:"0.08em",
            }}>
              <span>#</span><span>USUARIO</span>
              <span style={{textAlign:"center"}}>EXACTAS</span>
              <span style={{textAlign:"center"}}>CORRECTAS</span>
              <span style={{textAlign:"center"}}>FALLIDAS</span>
              <span style={{textAlign:"center"}}>ROL</span>
              <span style={{textAlign:"right"}}>PUNTOS</span>
            </div>
            {sorted.map((p, i) => {
              const pos = i+1;
              const posColor = pos===1?"#ffd43b":pos===2?"#adb5bd":pos===3?"#cd7f32":"#4a6fa5";
              const pct = Math.round((p.pts/maxPts)*100);
              return (
                <div key={p.id} style={{
                  borderBottom:"1px solid #111827",
                  background: pos===1?"#12180a":undefined,
                }}>
                  <div style={{
                    display:"grid", gridTemplateColumns:"40px 1fr 80px 80px 80px 70px 100px",
                    gap:8, padding:"14px 18px", alignItems:"center",
                  }}>
                    <span style={{ fontSize:16, fontWeight:800, color:posColor }}>{pos}</span>
                    <div>
                      <div style={{ fontSize:13, fontWeight:700, color:"#e2e8f0" }}>{p.nombre}</div>
                      <div style={{ fontSize:10, color:"#4a6fa5", marginTop:2 }}>ID #{p.id}</div>
                    </div>
                    <span style={{ textAlign:"center", fontSize:14, fontWeight:700, color:"#69db7c" }}>{p.exactas}</span>
                    <span style={{ textAlign:"center", fontSize:14, fontWeight:700, color:"#a9e34b" }}>{p.correctas}</span>
                    <span style={{ textAlign:"center", fontSize:14, fontWeight:700, color:"#ff8787" }}>{p.fallidas}</span>
                    <div style={{ display:"flex", justifyContent:"center" }}>
                      <BadgeRol rol={p.rol}/>
                    </div>
                    <div style={{ textAlign:"right" }}>
                      <div style={{ fontSize:18, fontWeight:800, color: pos===1?"#ffd43b":"#e2e8f0" }}>{p.pts}</div>
                      <div style={{ height:4, background:"#1e2a45", borderRadius:2, marginTop:4, overflow:"hidden" }}>
                        <div style={{ width:`${pct}%`, height:"100%", background: pos===1?"#ffd43b":"#3b5bdb", borderRadius:2 }}/>
                      </div>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ── TAB: MIS PREDICCIONES ─────────────────────────────────────────────────────

    function TabPredicciones() {
      const [preds, setPreds] = useState(prediccionesUsuario);
      const [editId, setEditId] = useState(null);
      const [gl, setGl] = useState(""); const [gv, setGv] = useState("");

      const partidosDePreds = preds.map(pr => {
        const partido = initialPartidos.find(p=>p.id===pr.partidoId);
        return { ...pr, partido };
      });

      const savePred = (partidoId) => {
        setPreds(prev => prev.map(p => p.partidoId===partidoId
          ? { ...p, golesL:parseInt(gl)||0, golesV:parseInt(gv)||0 }
          : p
        ));
        setEditId(null);
      };

      const totalPts = preds.reduce((a,p)=>a+p.pts,0);

      return (
        <div style={{ padding:"24px 0" }}>
          <div style={{ display:"flex", gap:12, marginBottom:20, flexWrap:"wrap" }}>
            <StatCard label="MIS PUNTOS" value={totalPts} accent="#ffd43b"/>
            <StatCard label="EXACTAS" value={preds.filter(p=>p.estado==="EXACTA").length} accent="#69db7c"/>
            <StatCard label="CORRECTAS" value={preds.filter(p=>p.estado==="CORRECTA").length} accent="#a9e34b"/>
            <StatCard label="FALLIDAS" value={preds.filter(p=>p.estado==="FALLIDA").length} accent="#ff8787"/>
          </div>

          <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
            {partidosDePreds.map(({ partido, golesL, golesV, estado, pts, partidoId }) => {
              if (!partido) return null;
              const loc = getEquipo(partido.local);
              const vis = getEquipo(partido.visitante);
              const c = PRED_COLOR[estado] || PRED_COLOR.PENDIENTE;
              const editable = partido.estado === "PROGRAMADO";
              const isEdit = editId === partidoId;

              return (
                <div key={partidoId} style={{
                  background:c.bg, border:`1px solid ${c.dot}44`,
                  borderRadius:12, padding:"14px 18px",
                }}>
                  <div style={{ display:"flex", alignItems:"center", gap:12, flexWrap:"wrap" }}>
                    <span style={{
                      display:"inline-flex", alignItems:"center", gap:4,
                      fontSize:10, fontWeight:700, color:c.text, minWidth:80,
                    }}>
                      <Dot color={c.dot}/>{estado}
                    </span>

                    <div style={{ flex:1, display:"flex", alignItems:"center", gap:8 }}>
                      <span style={{fontSize:16}}>{loc.flag}</span>
                      <span style={{fontSize:12, fontWeight:600, color:"#e2e8f0"}}>{loc.nombre}</span>
                      <span style={{color:"#4a6fa5", fontSize:12}}>vs</span>
                      <span style={{fontSize:12, fontWeight:600, color:"#e2e8f0"}}>{vis.nombre}</span>
                      <span style={{fontSize:16}}>{vis.flag}</span>
                    </div>

                    <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                      <span style={{ fontSize:11, color:"#4a6fa5" }}>Mi predicción:</span>
                      {isEdit ? (
                        <>
                          <input value={gl} onChange={e=>setGl(e.target.value)} type="number" min="0" max="20" style={{
                            width:32, textAlign:"center", background:"#1e2a45", border:"1px solid #3b5bdb",
                            color:"#e2e8f0", borderRadius:5, padding:"3px", fontSize:14, fontWeight:700,
                          }}/>
                          <span style={{color:"#4a6fa5"}}>–</span>
                          <input value={gv} onChange={e=>setGv(e.target.value)} type="number" min="0" max="20" style={{
                            width:32, textAlign:"center", background:"#1e2a45", border:"1px solid #3b5bdb",
                            color:"#e2e8f0", borderRadius:5, padding:"3px", fontSize:14, fontWeight:700,
                          }}/>
                          <button onClick={()=>savePred(partidoId)} style={btnStyle("#2f9e44")}>✓</button>
                          <button onClick={()=>setEditId(null)} style={btnStyle("#555")}>✕</button>
                        </>
                      ) : (
                        <>
                          <span style={{
                            fontSize:16, fontWeight:800, color:c.text, letterSpacing:3,
                          }}>{golesL} – {golesV}</span>
                          {editable && (
                            <button onClick={()=>{setEditId(partidoId);setGl(golesL);setGv(golesV);}} style={btnStyle("#4a6fa5")}>
                              ✎
                            </button>
                          )}
                        </>
                      )}
                    </div>

                    {partido.golesL !== null && (
                      <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                        <span style={{ fontSize:11, color:"#4a6fa5" }}>Real:</span>
                        <span style={{ fontSize:16, fontWeight:800, color:"#e2e8f0", letterSpacing:3 }}>
                          {partido.golesL} – {partido.golesV}
                        </span>
                      </div>
                    )}

                    <span style={{
                      fontSize:18, fontWeight:800,
                      color: pts>0?"#ffd43b":"#4a6fa5",
                      minWidth:40, textAlign:"right",
                    }}>+{pts}pts</span>
                  </div>
                </div>
              );
            })}
          </div>

          <div style={{
            marginTop:20, background:"#0d1628", border:"1px solid #ffd43b33",
            borderRadius:12, padding:"16px 20px",
          }}>
            <div style={{ fontSize:12, fontWeight:700, color:"#ffd43b", marginBottom:10, letterSpacing:"0.05em" }}>
              ⚽ Predicción Global del Torneo (RF-14)
            </div>
            <div style={{ display:"flex", gap:20, flexWrap:"wrap" }}>
              {[
                { label:"Campeón", value:"🇦🇷 Argentina" },
                { label:"Subcampeón", value:"🇫🇷 Francia" },
                { label:"Máx. Goleador", value:"L. Martínez" },
              ].map(item => (
                <div key={item.label} style={{
                  background:"#12180a", border:"1px solid #ffd43b22", borderRadius:8, padding:"10px 16px",
                }}>
                  <div style={{fontSize:10, color:"#6b7280", marginBottom:4}}>{item.label}</div>
                  <div style={{fontSize:14, fontWeight:700, color:"#ffd43b"}}>{item.value}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ── TAB: CLASES UML ───────────────────────────────────────────────────────────

    function UMLCard({ cls, selected, onClick }) {
      return (
        <div onClick={onClick} style={{
          background: selected ? `${cls.color}22` : "#0d1628",
          border: `1px solid ${selected ? cls.color : cls.color+"44"}`,
          borderRadius:10, cursor:"pointer", overflow:"hidden",
          transition:"all 0.15s", transform: selected?"scale(1.01)":"scale(1)",
        }}>
          <div style={{
            background:`${cls.color}33`, padding:"8px 12px",
            borderBottom:`1px solid ${cls.color}44`,
            display:"flex", justifyContent:"space-between", alignItems:"center",
          }}>
            <span style={{ fontSize:13, fontWeight:700, color:"#e2e8f0" }}>{cls.name}</span>
            <span style={{
              fontSize:9, fontWeight:700, color:cls.color, background:`${cls.color}22`,
              padding:"2px 8px", borderRadius:10, letterSpacing:"0.06em",
            }}>«class»</span>
          </div>
          <div style={{ padding:"8px 12px", borderBottom:`1px solid ${cls.color}22` }}>
            {cls.attrs.map(a => (
              <div key={a} style={{ fontSize:10, color:"#9ca3af", padding:"1px 0", fontFamily:"monospace" }}>{a}</div>
            ))}
          </div>
          {selected && (
            <div style={{ padding:"8px 12px" }}>
              {cls.methods.map(m => (
                <div key={m} style={{ fontSize:10, color:"#6ee7b7", padding:"1px 0", fontFamily:"monospace" }}>{m}</div>
              ))}
            </div>
          )}
          {!selected && (
            <div style={{ padding:"4px 12px" }}>
              <span style={{ fontSize:10, color:"#4a6fa5" }}>{cls.methods.length} métodos · click para expandir</span>
            </div>
          )}
        </div>
      );
    }

    function TabUML() {
      const [selected, setSelected] = useState(null);
      const [activeGroup, setActiveGroup] = useState("all");
      const groups = [
        { id:"all", label:"Todas las clases" },
        { id:"gestion", label:"Gestión" },
        { id:"prediccion", label:"Predicciones" },
        { id:"soporte", label:"Soporte" },
        { id:"enums", label:"Enumeraciones" },
      ];
      const filtered = activeGroup==="all" || activeGroup==="enums"
        ? UML_CLASES
        : UML_CLASES.filter(c=>c.group===activeGroup);

      return (
        <div style={{ padding:"24px 0" }}>
          <div style={{ display:"flex", gap:6, marginBottom:18, flexWrap:"wrap" }}>
            {groups.map(g => (
              <button key={g.id} onClick={()=>setActiveGroup(g.id)} style={{
                background: activeGroup===g.id?"#1e3a6e":"transparent",
                border: activeGroup===g.id?"1px solid #3b5bdb":"1px solid #1e2a45",
                color: activeGroup===g.id?"#748ffc":"#4a6fa5",
                fontSize:11, fontWeight:600, padding:"5px 14px", borderRadius:20,
                cursor:"pointer", letterSpacing:"0.04em",
              }}>{g.label}</button>
            ))}
          </div>

          {activeGroup !== "enums" && (
            <>
              <div style={{ fontSize:11, color:"#4a6fa5", marginBottom:12 }}>
                {filtered.length} clases · Haz clic en una tarjeta para ver los métodos
              </div>
              <div style={{
                display:"grid", gap:10,
                gridTemplateColumns:"repeat(auto-fill, minmax(240px, 1fr))",
              }}>
                {filtered.map(cls => (
                  <UMLCard key={cls.name} cls={cls}
                    selected={selected===cls.name}
                    onClick={()=>setSelected(selected===cls.name ? null : cls.name)}
                  />
                ))}
              </div>
            </>
          )}

          {(activeGroup==="all" || activeGroup==="enums") && (
            <div style={{ marginTop: activeGroup==="all"?28:0 }}>
              {activeGroup==="all" && (
                <div style={{ fontSize:11, fontWeight:700, color:"#4a6fa5", letterSpacing:"0.08em", marginBottom:12 }}>
                  ENUMERACIONES
                </div>
              )}
              <div style={{
                display:"grid", gap:10,
                gridTemplateColumns:"repeat(auto-fill, minmax(180px, 1fr))",
              }}>
                {ENUMS.map(en => (
                  <div key={en.name} style={{
                    background:"#0d1628", border:"1px solid #2d1a4a",
                    borderRadius:10, overflow:"hidden",
                  }}>
                    <div style={{
                      background:"#2d1a4a", padding:"7px 12px",
                      borderBottom:"1px solid #3d2060",
                      display:"flex", justifyContent:"space-between", alignItems:"center",
                    }}>
                      <span style={{fontSize:12, fontWeight:700, color:"#e2e8f0"}}>{en.name}</span>
                      <span style={{fontSize:9, color:"#a78bfa", fontWeight:600}}>«enum»</span>
                    </div>
                    <div style={{ padding:"8px 12px" }}>
                      {en.values.map(v => (
                        <div key={v} style={{ fontSize:10, color:"#c4b5fd", padding:"2px 0", fontFamily:"monospace" }}>
                          {v}
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ── ROOT ──────────────────────────────────────────────────────────────────────

    function App() {
      const [tab, setTab] = useState("Partidos");

      const tabContent = {
        "Partidos":          <TabPartidos/>,
        "Ranking":           <TabRanking/>,
        "Mis Predicciones":  <TabPredicciones/>,
        "Clases UML":        <TabUML/>,
      };

      return (
        <div style={{
          background:"#060c18", minHeight:"100vh",
          fontFamily:"'DM Mono', 'Fira Code', monospace",
          color:"#e2e8f0",
        }}>
          <Header tab={tab} setTab={setTab}/>
          <main style={{ maxWidth:860, margin:"0 auto", padding:"0 20px" }}>
            {tabContent[tab]}
          </main>
        </div>
      );
    }

    // ── RENDER ────────────────────────────────────────────────────────────────────

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
