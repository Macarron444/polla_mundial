
<div id="u3" style="padding:1rem 0;overflow-x:auto"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad:false, theme:'base',
  fontFamily:'"Anthropic Sans", sans-serif',
  themeVariables:{
    darkMode:dark, fontSize:'13px',
    fontFamily:'"Anthropic Sans", sans-serif',
    lineColor: dark?'#9c9a92':'#73726c',
    textColor: dark?'#c2c0b6':'#3d3d3a',
    primaryColor: dark?'#3C3489':'#EEEDFE',
    primaryTextColor: dark?'#CECBF6':'#26215C',
    primaryBorderColor: dark?'#7F77DD':'#AFA9EC',
    secondaryColor: dark?'#085041':'#E1F5EE',
    secondaryTextColor: dark?'#9FE1CB':'#04342C',
    secondaryBorderColor: dark?'#1D9E75':'#5DCAA5',
    tertiaryColor: dark?'#633806':'#FAEEDA',
    tertiaryTextColor: dark?'#FAC775':'#412402',
    tertiaryBorderColor: dark?'#BA7517':'#EF9F27',
    classText: dark?'#c2c0b6':'#3d3d3a',
  }
});
const d = `classDiagram
  direction LR

  class EstadoPartido {
    <<enumeration>>
    PROGRAMADO
    EN_CURSO
    FINALIZADO
    SUSPENDIDO
    POSPUESTO
  }

  class FasePartido {
    <<enumeration>>
    GRUPOS
    DIECISEISAVOS
    OCTAVOS
    CUARTOS
    SEMIFINAL
    FINAL
  }

  class EstadoPrediccion {
    <<enumeration>>
    PENDIENTE
    EXACTA
    CORRECTA
    FALLIDA
  }

  class RolPolla {
    <<enumeration>>
    CREADOR
    ADMINISTRADOR
    PARTICIPANTE
  }

  class TipoNotificacion {
    <<enumeration>>
    PUSH
    IN_APP
    EMAIL
  }

  class VisibilidadPolla {
    <<enumeration>>
    PUBLICA
    PRIVADA
  }

  class EstadoPolla {
    <<enumeration>>
    ACTIVA
    CERRADA
    ARCHIVADA
  }

  class Partido {
    +EstadoPartido estado
    +FasePartido fase
  }
  class Prediccion {
    +EstadoPrediccion estado
  }
  class ParticipacionPolla {
    +RolPolla rol
  }
  class Notificacion {
    +TipoNotificacion tipo
  }
  class Polla {
    +VisibilidadPolla visibilidad
    +EstadoPolla estado
  }

  Partido --> EstadoPartido : estado
  Partido --> FasePartido : fase
  Prediccion --> EstadoPrediccion : estado
  ParticipacionPolla --> RolPolla : rol
  Notificacion --> TipoNotificacion : tipo
  Polla --> VisibilidadPolla : visibilidad
  Polla --> EstadoPolla : estado
`;
const {svg} = await mermaid.render('u3-svg', d);
document.getElementById('u3').innerHTML = svg;
const el = document.querySelector('#u3 svg');
if(el){el.style.width='100%';el.style.maxWidth='100%';}
</script>
